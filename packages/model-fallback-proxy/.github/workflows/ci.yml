name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check "build==1.2.2.post1" "setuptools==80.9.0" "wheel==0.45.1"
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check.py
      - run: python -m build --no-isolation
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "import model_fallback_proxy"
      - run: model-fallback probe
      - run: model-fallback route --input examples/basic.json

