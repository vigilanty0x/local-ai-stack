[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="model-fallback-proxy"
version="0.1.0"
description="Offline fail-closed model fallback router"
readme="README.md"
requires-python=">=3.11"
license={text="Apache-2.0"}
dependencies=[]
[project.scripts]
model-fallback="model_fallback_proxy:main"
[tool.setuptools]
package-dir={""="src"}
[tool.setuptools.packages.find]
where=["src"]
